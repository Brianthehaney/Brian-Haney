<title>Brian's Christmas Wish List</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: string-light header band, then a filterable grid of pixel-icon gift cards; owner-only editor slides in above the grid. */
:root{
  --bg:#edf3f0; --fg:#1b2a23; --muted:#56695f; --card:#ffffff; --line:#cddbd4;
  --accent:#bf2f2c; --pine:#1f5c43; --gold:#b8891f; --chip:#e3ece8;
  --tile-a:#1f5c43; --tile-b:#8e1f2b; --tile-c:#24456b;
  --display:"Pixelify Sans","Courier New",monospace;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --shadow:0 1px 0 rgba(20,40,30,.06),0 6px 18px -10px rgba(20,40,30,.25);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1b16; --fg:#ecf3ee; --muted:#9bb2a6; --card:#15281f; --line:#27423a;
  --accent:#ff6a5f; --pine:#74d29c; --gold:#f2c14e; --chip:#1d3429;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 24px -14px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1b16; --fg:#ecf3ee; --muted:#9bb2a6; --card:#15281f; --line:#27423a;
  --accent:#ff6a5f; --pine:#74d29c; --gold:#f2c14e; --chip:#1d3429;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 24px -14px rgba(0,0,0,.7); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
header{padding-block:28px 18px}
.lights{height:22px;position:relative;margin-bottom:18px;
  background:radial-gradient(circle at 50% 0,transparent 0 9px,var(--line) 9px 10px,transparent 10px) 0 -2px/36px 18px repeat-x}
.lights i{position:absolute;top:8px;width:8px;height:12px;border-radius:0;
  box-shadow:0 0 10px currentColor;background:currentColor;animation:twinkle 2.4s steps(2) infinite}
@keyframes twinkle{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.lights i{animation:none}}
h1{font-family:var(--display);font-weight:700;font-size:clamp(30px,6vw,54px);line-height:1.02;margin:0;letter-spacing:.01em;text-wrap:balance}
h1 .spark{color:var(--gold)}
.sub{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;margin-top:12px;color:var(--muted);font-size:14px}
.sub b{color:var(--fg);font-variant-numeric:tabular-nums}
.countdown{font-family:var(--display);color:var(--accent);font-size:15px}

/* toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-block:6px 18px}
.chip{font:600 13px/1 var(--body);border:1px solid var(--line);background:var(--chip);color:var(--fg);padding:8px 12px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip:focus-visible,.btn:focus-visible,.store:focus-visible,.iconpick button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.spacer{flex:1}
.btn{font:700 14px/1 var(--body);border:0;border-radius:10px;padding:11px 16px;cursor:pointer;background:var(--accent);color:#fff}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.small{padding:7px 10px;font-size:12px;border-radius:8px}
.status{font-size:13px;color:var(--muted);min-height:1em}

/* editor */
.editor{background:var(--card);border:2px solid var(--fg);border-radius:14px;padding:18px;margin-bottom:22px;display:grid;grid-template-columns:120px 1fr;gap:18px}
.editor h2{font-family:var(--display);margin:0 0 4px;font-size:22px;grid-column:1/-1}
.preview{display:flex;flex-direction:column;align-items:center;gap:8px}
.preview .tile{width:112px;height:112px}
.preview small{color:var(--muted);font-size:12px;text-align:center}
.fields{display:grid;gap:12px;min-width:0}
label{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:grid;gap:5px}
input[type=text],textarea{font:15px/1.4 var(--body);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px 12px;width:100%}
textarea{min-height:84px;resize:vertical}
.check{flex-direction:row;display:flex;align-items:center;gap:8px;text-transform:none;letter-spacing:0;font-size:14px;color:var(--fg);font-weight:600}
.iconpick{display:flex;flex-wrap:wrap;gap:6px}
.iconpick button{width:42px;height:42px;padding:3px;border:2px solid transparent;border-radius:8px;background:var(--chip);cursor:pointer}
.iconpick button[aria-pressed="true"]{border-color:var(--accent)}
.iconpick button img{width:100%;height:100%;image-rendering:pixelated}
.iconpick .auto{width:auto;padding:0 10px;font:700 12px var(--body);color:var(--fg)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
@media (max-width:560px){.editor{grid-template-columns:1fr}.preview{flex-direction:row}}

/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px;padding-bottom:48px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;grid-template-columns:88px 1fr;gap:14px;box-shadow:var(--shadow);position:relative}
.card.top{border-color:var(--gold)}
.tile{width:88px;height:88px;border-radius:10px;display:grid;place-items:center;position:relative;overflow:hidden;
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.14),inset 0 -6px 0 rgba(0,0,0,.18)}
.tile.a{background:var(--tile-a)} .tile.b{background:var(--tile-b)} .tile.c{background:var(--tile-c)}
.tile img{width:84%;height:84%;image-rendering:pixelated;image-rendering:crisp-edges}
.body{min-width:0;display:grid;gap:6px;align-content:start}
.title{font-weight:700;font-size:16px;line-height:1.25;margin:0;text-wrap:balance;overflow-wrap:anywhere}
.note{color:var(--muted);font-size:13.5px;margin:0;overflow-wrap:anywhere}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.badge{font:700 11px/1 var(--display);letter-spacing:.04em;padding:4px 7px;border-radius:5px;background:var(--chip);color:var(--muted)}
.badge.top{background:var(--gold);color:#1b1404}
.stores{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.store{display:inline-flex;align-items:center;gap:5px;font:600 12.5px/1 var(--body);color:var(--fg);text-decoration:none;border:1px solid var(--line);padding:7px 9px;border-radius:8px;background:var(--bg);max-width:100%}
.store:hover{border-color:var(--accent);color:var(--accent)}
.store svg{flex:none}
.store span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.owner{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.section{grid-column:1/-1;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-top:18px;margin-top:8px;border-top:2px dashed var(--line)}
.section img{width:40px;height:40px;image-rendering:pixelated;background:var(--tile-c);border-radius:8px;padding:3px}
.section h2{font-family:var(--display);font-size:26px;margin:0}
.section span{color:var(--muted);font-size:14px}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px 0}
footer{color:var(--muted);font-size:13px;padding-block:0 40px}
</style>

<div class="wrap">
  <header>
    <div class="lights" id="lights" aria-hidden="true"></div>
    <h1>Brian's Christmas Wish List <span class="spark">✨</span></h1>
    <div class="sub">
      <span><b id="count">0</b> wishes</span>
      <span><b id="stores-count">0</b> stores</span>
      <span class="countdown" id="countdown"></span>
    </div>
  </header>

  <div class="toolbar">
    <div class="row" id="filters" role="group" aria-label="Filter by category"></div>
    <span class="spacer"></span>
    <span class="status" id="status" aria-live="polite"></span>
    <button class="btn" id="add-btn" type="button" hidden>+ Add a wish</button>
  </div>

  <form class="editor" id="editor" hidden>
    <h2 id="editor-title">Add a wish</h2>
    <div class="preview">
      <div class="tile a" id="preview-tile"><img id="preview-img" alt=""></div>
      <small id="preview-label">Gift box</small>
    </div>
    <div class="fields">
      <label for="f-title">What do you want?
        <input type="text" id="f-title" placeholder="e.g. Brown leather watch roll" required autocomplete="off"></label>
      <label for="f-note">Details (size, color, engraving)
        <input type="text" id="f-note" placeholder="e.g. Size 13, warm brown" autocomplete="off"></label>
      <label for="f-links">Store links, one per line
        <textarea id="f-links" placeholder="https://store.com/product&#10;Optional label | https://other-store.com/item"></textarea></label>
      <div>
        <label>Pixel icon</label>
        <div class="iconpick" id="iconpick"></div>
      </div>
      <label class="check" for="f-top"><input type="checkbox" id="f-top"> Top pick</label>
      <div class="row">
        <button class="btn" type="submit" id="f-save">Save wish</button>
        <button class="btn ghost" type="button" id="f-cancel">Cancel</button>
      </div>
    </div>
  </form>

  <main class="grid" id="grid" aria-live="polite"></main>
  <footer>Tap a store button to open the item. Tracking codes are stripped from every link.</footer>
</div>

  $("f-top").checked = it ? !!it.top : false;
  chosenIcon = it ? it.icon : "auto";
  buildPicker(); updatePreview();
  $("editor").hidden = false; $("f-title").focus(); $("editor").scrollIntoView({behavior:"smooth", block:"start"});
}
function closeEditor(){ $("editor").hidden = true; editingId = null; }
["f-title","f-note","f-links"].forEach(function(id){ $(id).addEventListener("input", function(){ if (chosenIcon === "auto") updatePreview(); }); });
$("f-cancel").onclick = closeEditor;
$("add-btn").onclick = function(){ openEditor(null); };
$("editor").addEventListener("submit", function(ev){
  ev.preventDefault();
  var title = $("f-title").value.trim(); if (!title) return;
  var links = $("f-links").value.split(/\n+/).map(function(line){
    line = line.trim(); if (!line) return null;
    var label = "", url = line, m = line.match(/^(.*?)\s*\|\s*(https?:\/\/\S+)$/i);
    if (m) { label = m[1].trim(); url = m[2]; } else { var u = line.match(/https?:\/\/\S+/i); if (!u) return null; url = u[0]; }
    url = cleanURL(url); return url ? {url:url, label:label} : null;
  }).filter(Boolean);
  var data = {title:title, note:$("f-note").value.trim(), icon:currentIcon(), top:$("f-top").checked, links:links};
  if (editingId) { var it = state.items.find(function(x){ return x.id === editingId; }); Object.assign(it, data); }
  else { state.items.unshift(Object.assign({id:"w" + Date.now().toString(36)}, data)); }
  closeEditor(); changed();
});

/* ---------- saving: republish the page with the new list ---------- */
var saveTimer = null, saving = false;
function setStatus(t){ $("status").textContent = t; }
function changed(){ renderAll(); setStatus("Saving…"); clearTimeout(saveTimer); saveTimer = setTimeout(save, 900); }
function buildDocument(){
  var rs = document.head.querySelector("style"); var reset = rs ? rs.textContent : RESET_FALLBACK;
  var json = JSON.stringify(state).replace(/</g, "\\u003c");
  var body = SOURCE.map(function(p){ return typeof p === "string" ? p : '<script type="application/json" id="wish-data">' + json + "<\/script>"; }).join("");
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + reset + "</style></head><body>" + body + "</body></html>";
}
function save(){
  if (!artifact || saving) return; saving = true;
  try { sessionStorage.setItem("wish-filter", filter); } catch (e) {}
  artifact.publish(buildDocument()).then(function(){ setStatus("Saved"); }, function(err){
    var c = err && err.code;
    if (c === "conflict") setStatus("Someone saved first. Reloading…");
    else if (c === "not_writer" || c === "not_granted" || c === "not_declared" || c === "consent_required" || c === "capability_disabled") { canEdit = false; $("add-btn").hidden = true; renderAll(); setStatus("This view is read-only."); }
    else if (c === "rate_limited") { setStatus("Saving too fast. Retrying shortly…"); setTimeout(save, 5000); }
    else setStatus("Couldn't save. Try that change again.");
  }).then(function(){ saving = false; });
}

renderAll();

/* ---------- light up editing for the list owner ---------- */
if (window.claude && typeof window.claude.use === "function") {
  Promise.all([window.claude.use("artifact"), window.claude.use("user")]).then(function(r){
    artifact = r[0]; var user = r[1];
    if (!artifact || !user) return false;
    return Promise.all([user.isOwner(), user.canEdit()]).then(function(v){ return v[0] || v[1]; });
  }).then(function(ok){
    if (!ok) return; canEdit = true; $("add-btn").hidden = false; renderGrid();
  }).catch(function(){});
}
})();
</script>
